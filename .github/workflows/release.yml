name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm test
      - name: Build archive and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          zip -j "dist/log-sanitizer-${TAG}.zip" log-sanitizer.html README.md LICENSE
          cp log-sanitizer.html dist/log-sanitizer.html
          cd dist
          sha256sum "log-sanitizer-${TAG}.zip" log-sanitizer.html > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "dist/log-sanitizer-${TAG}.zip" dist/log-sanitizer.html dist/SHA256SUMS.txt \
            --title "$TAG" --generate-notes --verify-tag
